<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FLIRC8 — ANN Predictor (q_c, q_r, IRI, U)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<style>
  :root { --accent:#0b6cf2; --bg:#f7f9fc; --card:#fff; --txt:#1b1f24; --muted:#6b7280; }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:var(--bg);color:var(--txt);padding:24px;}
  h1{margin:0 0 6px;font-size:22px}
  p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  .wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;margin:8px 0 4px;color:#374151}
  input,select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
  button{margin-top:14px;padding:10px 16px;background:var(--accent);color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:14px}
  button:disabled{background:#9ca3af;cursor:not-allowed}
  .out{margin-top:14px;padding:12px;background:#f0f5ff;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #log{font-size:12px;color:var(--muted);max-height:140px;overflow:auto;margin-top:8px}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap">

  <!-- ========== TRAINING CARD ========== -->
  <div class="card">
    <h1>Model Training</h1>
    <p class="sub">ANN trained in your browser on the embedded FLIRC8 dataset (n = 50).</p>

    <div class="row">
      <div><label>Epochs</label><input id="epochs" type="number" value="500" min="50" step="50"></div>
      <div><label>Batch size</label><input id="batch" type="number" value="8" min="1"></div>
    </div>
    <button id="trainBtn">Train ANN</button>
    <div class="out" id="metrics">Status: not trained yet.</div>
    <div id="log"></div>
  </div>

  <!-- ========== PREDICTION CARD ========== -->
  <div class="card">
    <h1>Prediction</h1>
    <p class="sub">Enter inputs to estimate q_c, q_r, IRI, U.</p>

    <div class="row">
      <div><label>ε (emissivity)</label><input id="eps" type="number" step="0.01" value="0.95"></div>
      <div><label>T_atm (°C)</label><input id="Tatm" type="number" step="0.1" value="18.0"></div>
      <div><label>T_in (°C)</label><input id="Tin" type="number" step="0.1" value="21.0"></div>
      <div><label>h_c (W/m²·K)</label><input id="hc" type="number" step="0.1" value="8.7"></div>
      <div><label>σ (W/m²·K⁴)</label><input id="sig" type="number" step="any" value="5.67e-8"></div>
      <div><label>T_avg (°C)</label><input id="Tavg" type="number" step="0.1" value="21.0"></div>
    </div>

    <label>Pathology</label>
    <select id="path">
      <option value="is_CRK">CRK — Cracking</option>
      <option value="is_EFF">EFF — Efflorescence</option>
      <option value="is_SPL">SPL — Spalling</option>
      <option value="is_BIO">BIO — Biological growth</option>
      <option value="is_MJD">MJD — Major Joint Defect</option>
      <option value="is_NoPath" selected>NoPath — No pathology</option>
    </select>

    <button id="predBtn" disabled>Predict</button>
    <div class="out" id="result">Train the model first to enable predictions.</div>
  </div>

</div>

<script>
/* ---------- 1. Embedded dataset (REVISED) ---------- */
const COLS = ["eps","Tatm","Tin","hc","sig","Tavg",
              "is_CRK","is_EFF","is_SPL","is_BIO","is_MJD","is_NoPath",

[0.95,19.2,22.2,8.7,5.67e-8,19.43,0,0,0,1,0,0,2.0,1.2,0.077,2.432],
[0.95,21.0,24.0,8.7,5.67e-8,21.23,0,0,0,1,0,0,2.0,1.3,0.078,2.452],
[0.95,16.1,21.0,8.7,5.67e-8,16.31,0,0,0,1,0,0,1.8,1.1,0.043,2.046],
[0.95,18.2,21.2,8.7,5.67e-8,18.43,0,0,0,1,0,0,2.0,1.2,0.077,2.421],
[0.95,17.9,21.0,8.7,5.67e-8,18.13,0,0,0,0,1,0,2.0,1.2,0.074,2.385],
[0.95,19.7,22.7,8.7,5.67e-8,19.93,0,0,0,0,1,0,2.0,1.3,0.077,2.437],
[0.95,21.4,24.4,8.7,5.67e-8,21.63,0,0,0,0,1,0,2.0,1.3,0.078,2.456],
[0.95,16.6,21.0,8.7,5.67e-8,16.81,0,0,0,0,1,0,1.9,1.1,0.048,2.108],
[0.95,20.3,23.3,8.7,5.67e-8,20.53,0,0,0,0,1,0,2.0,1.3,0.077,2.444]
];

const CONT_IDX = [0,1,2,3,4,5];
const PATH_IDX = [6,7,8,9,10,11];
const OUT_IDX  = [12,13,14,15];
const OUT_NAMES = ["q_c (W/m²)","q_r (W/m²)","IRI","U (W/m²·K)"];

/* ---------- 2. Tensors + scaler stats ---------- */
let model, xMean, xStd, yMean, yStd;

function computeStats(arr){
  const t = tf.tensor2d(arr);
  const m = t.mean(0);
  const s = t.sub(m).square().mean(0).sqrt().add(1e-8);
  return [m,s];
}

function logMsg(t){ document.getElementById("log").innerHTML += t+"<br>"; }

/* ---------- 3. Train ---------- */
async function trainModel(){
  document.getElementById("trainBtn").disabled = true;
  document.getElementById("metrics").textContent = "Training…";
  document.getElementById("log").innerHTML = "";

  const Xc = DATA.map(r=>CONT_IDX.map(i=>r[i]));
  const Xp = DATA.map(r=>PATH_IDX.map(i=>r[i]));
  const Y  = DATA.map(r=>OUT_IDX.map(i=>r[i]));

  [xMean,xStd] = computeStats(Xc);
  [yMean,yStd] = computeStats(Y);

  const XcTensor = tf.tensor2d(Xc).sub(xMean).div(xStd);
  const XpTensor = tf.tensor2d(Xp);
  const X = tf.concat([XcTensor, XpTensor], 1);
  const y = tf.tensor2d(Y).sub(yMean).div(yStd);

  model = tf.sequential();
  model.add(tf.layers.dense({inputShape:[12],units:64,activation:"relu",kernelInitializer:"heNormal"}));
  model.add(tf.layers.dropout({rate:0.1}));
  model.add(tf.layers.dense({units:64,activation:"relu",kernelInitializer:"heNormal"}));
  model.add(tf.layers.dropout({rate:0.1}));
  model.add(tf.layers.dense({units:32,activation:"relu",kernelInitializer:"heNormal"}));
  model.add(tf.layers.dense({units:4,activation:"linear"}));
  model.compile({optimizer:tf.train.adam(1e-3),loss:"meanSquaredError",metrics:["mae"]});

  const epochs = +document.getElementById("epochs").value;
  const batch  = +document.getElementById("batch").value;

  await model.fit(X,y,{
    epochs, batchSize:batch, validationSplit:0.2, shuffle:true,
    callbacks:{onEpochEnd:(e,l)=>{ if(e%50===0) logMsg(`epoch ${e}: loss=${l.loss.toFixed(4)} val_loss=${l.val_loss.toFixed(4)}`);}}
  });

  // training-set R² per output
  const yhatScaled = model.predict(X);
  const yhat = yhatScaled.mul(yStd).add(yMean);
  const yTrue = tf.tensor2d(Y);
  const ssRes = yTrue.sub(yhat).square().sum(0);
  const ssTot = yTrue.sub(yTrue.mean(0)).square().sum(0);
  const r2 = tf.scalar(1).sub(ssRes.div(ssTot));
  const r2Vals = await r2.array();

  let txt = "Training complete.\nR² (in-sample):\n";
  OUT_NAMES.forEach((n,i)=> txt += `  ${n}: ${r2Vals[i].toFixed(3)}\n`);
  document.getElementById("metrics").textContent = txt;

  document.getElementById("predBtn").disabled = false;
  document.getElementById("trainBtn").disabled = false;
  document.getElementById("result").textContent = "Model ready — enter inputs and click Predict.";
}

/* ---------- 4. Predict ---------- */
async function predict(){
  if(!model){alert("Train first.");return;}
  const cont = [
    +document.getElementById("eps").value,
    +document.getElementById("Tatm").value,
    +document.getElementById("Tin").value,
    +document.getElementById("hc").value,
    +document.getElementById("sig").value,
    +document.getElementById("Tavg").value
  ];
  const pathSel = document.getElementById("path").value;
  const pathVec = ["is_CRK","is_EFF","is_SPL","is_BIO","is_MJD","is_NoPath"]
                  .map(p => p===pathSel?1:0);

  const xc = tf.tensor2d([cont]).sub(xMean).div(xStd);
  const xp = tf.tensor2d([pathVec]);
  const xin = tf.concat([xc,xp],1);

  const yhat = model.predict(xin).mul(yStd).add(yMean);
  const arr = (await yhat.array())[0];

  let txt = "Predicted outputs:\n";
  OUT_NAMES.forEach((n,i)=> txt += `  ${n.padEnd(14)} = ${arr[i].toFixed(3)}\n`);
  document.getElementById("result").textContent = txt;
}

/* ---------- 5. Wire up ---------- */
document.getElementById("trainBtn").addEventListener("click", trainModel);
document.getElementById("predBtn").addEventListener("click", predict);
</script>

</html>
